name: Build JARVIS Wake Word APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check whether owner release-signing secrets are configured
        id: release_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Using temporary debug-certificate signature for release preview only. Do not distribute it or expect future builds to update over it."
          fi

      - name: Lint and build debug plus release variants
        run: gradle lintDebug assembleDebug assembleRelease

      - name: Verify debug APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Verify release APK signature and non-debuggable configuration
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RELEASE_APK" > "$RUNNER_TEMP/release-badging.txt"
          if grep -q "application-debuggable" "$RUNNER_TEMP/release-badging.txt"; then
            echo "ERROR: release variant is debuggable."
            exit 1
          fi
          echo "Release APK is signed and does not advertise application-debuggable."

      - name: Upload debug APK for development tests
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-wakeword-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload temporary release preview
        if: steps.release_signing.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-wakeword-release-preview-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      # Owner-controlled release signing: never commit a keystore or password.
      - name: Prepare owner release signing key
        if: steps.release_signing.outputs.available == 'true'
        env:
          JARVIS_KEYSTORE_BASE64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$JARVIS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-release.jks"
          echo "JARVIS_KEYSTORE_PATH=$RUNNER_TEMP/jarvis-release.jks" >> "$GITHUB_ENV"

      - name: Build owner-signed release APK
        if: steps.release_signing.outputs.available == 'true'
        env:
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
        run: |
          gradle assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload owner-signed release APK
        if: steps.release_signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-wakeword-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
